# The client's configuration (template). Desktop: copy it to config/client.cfg (ignored by git). Android: the file is
# Android/data/<package>/files/client.cfg, next to packs/ (com.cer0labs.vanilladroid; dev.cer.vanilladroid for the
# development builds). Every key is optional; a development launch (the desktop's command line, the intent's extras)
# overrides it.

# The realm server (1.12's realmlist): "host" or "host:port", 3724 when the port is left out (logon.example.org,
# 192.168.1.20:3724). Empty: the login screen asks for it (its Server button). What the player sets there is kept in
# WTF/Config.wtf and wins over this line, as does a realmlist.wtf next to WTF ("set realmlist logon.example.org").
realm.address      =
realm.name         =                  # the realm to enter by itself when listed (the last one played wins)
account            =                  # the account name the login screen starts with (the password is never kept)
character          =                  # enters the world with this character as soon as the list arrives
locale             = enUS             # the interface's language: enUS, or one of locale/ (esES); missing -> English.
                                      # With the language packs (vd_baker bake --only locale) also the client's
                                      # tables, maps and voices in that language, and the server answers in it
